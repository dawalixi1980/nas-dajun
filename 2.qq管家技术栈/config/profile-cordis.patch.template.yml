# 本文件是 DSH profile 配置的模板（已脱敏）
# 实际使用位置：~/.dsh/profiles/desktop/cordis.patch.yml
# 使用前把 <...> 替换成真实值，不要提交真实密钥到仓库。
#
# 只保留了与 QQ 机器人 / QQ 管家相关的段落，其余 DSH 默认配置未包含。

# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: office
    process: compact
    completion: completed
    usage: compact
    developerTools: false
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: compact
    performanceUsage: compact
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: false
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: qqbot-multi
  name: dsh-qqbot-multi
  disabled: false
  config:
    cwd: "/Users/dada/项目文件"
    # 群聊：全量归档（静默记账），只在 @ 机器人时回复
    requireMention: true
    historyLimit: 3
    textChunkLimit: 4500
    sendFile:
      restrictPaths: true
      extraRoots:
        - "/Users/dada/项目文件"
        - "/Volumes/达骏1/项目文件"
        - "/Volumes/达骏2/项目文件"
    bots:
      - id: "1906310823"
        name: 机器人1906310823
        enabled: true
        appId: "1906310823"
        appSecret: <填写你的 AppSecret>
        provider: ollama
        model: qwen3-8b-dsh
        cwd: /Volumes/达骏1/项目文件
        access:
          c2cMode: open
          c2cAllow: []
          groupMode: open
          groupAllow: []
      - id: "1905830497"
        name: 小宝
        enabled: true
        appId: "1905830497"
        appSecret: <填写你的 AppSecret>
        access:
          c2cMode: open
          c2cAllow: []
          groupMode: open
          groupAllow: []
      - id: 8070b8fb3157-im-bot
        name: 微信机器人
        enabled: true
        platform: weixin
        botToken: <填写你的 botToken>
        baseUrl: https://ilinkai.weixin.qq.com/
        access:
          c2cMode: open
          c2cAllow: []
          groupMode: open
          groupAllow: []
      - id: "1906394752"
        name: 戴小宝
        enabled: true
        appId: "1906394752"
        appSecret: <填写你的 AppSecret>
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
      ollama:
        displayName: 本地 Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        defaultContextWindow: 32768
        defaultMaxTokens: 8192
        streamIdleTimeoutMs: 600000
        models:
          - id: qwen3-8b-dsh
            name: Qwen3 8B（本地 · 32K）
            contextWindow: 32768
            maxTokens: 8192
            input:
              - text
            reasoningEfforts: false
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              supportsReasoningEffort: false
              supportsUsageInStreaming: false

# 本地小上下文模型（ollama/qwen3-8b-dsh）的压缩策略：
# 默认 headroomTokens=65536 放不进 32K 窗口，切模型时会被 MODEL_SWITCH_COMPACTION_FAILED 拒绝。
# 这一行整份覆盖 shipped 的 cordis preset（Loader 的 config 是整体替换、不深合并）；
# DSH 升级后若官方 preset 变了，需要拿新版 presets/cordis.patch.yml 重新生成这一段。
- id: preset-cordis
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: cordis
    order: 4
    plugins:
      # Same persona as `standard`: tool descriptions and the skill catalog carry
      # the operating detail, and the skills own the preset-authoring rules.
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          # Set true to add the apply_patch tool beside edit.
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            config:
              modelPolicies:
                - provider: ollama
                  model: qwen3-8b-dsh
                  headroomTokens: 4096
                  maxTokens: 4096
                  thresholdRatio: 0.7
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: tool-cordis
        name: '@deepseek-ai/dsh-tool-cordis'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: !!js "!ctx.get('profileContext')"
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: !!js "!ctx.get('profileContext')"
